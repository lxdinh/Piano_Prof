name: Quality

# Runs on EVERY branch and pull request.
#
# The gate used to live inside build-eas.yml, which triggers only on pushes to
# `main` — so feature branches accumulated dozens of commits without a single
# typecheck, test or lint run, and the first real verification happened after
# merge. Splitting it out means a branch is gated from its first push, and it
# costs no EAS credits.
on:
  push:
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Test · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `ci` not `install`: fail loudly if package-lock.json is out of step
      # rather than silently resolving something different from the app build.
      - name: Install dependencies
        run: npm ci

      # Kept as separate steps so the failing one is obvious in the run summary.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      - name: Lint
        run: npm run lint
