name: Build & Release APK

on:
  push:
    tags:
      - 'v*'          # triggers on v0.6.0, v1.0.0, etc.

  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java (required by Gradle) ────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Flutter ──────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'   # 3.24+ uses Kotlin Gradle plugin (fixes groovy.xml.QName error)
          channel: stable
          cache: true

      # ── Dependencies ─────────────────────────────────────────────
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      # ── Build release APK ─────────────────────────────────────────
      # Uses debug signing key so the APK is installable without a keystore.
      # To switch to a real keystore, add secrets (see SIGNING section below).
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      # ── Rename APK to include tag version ────────────────────────
      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME:-manual}
          cp mobile/build/app/outputs/flutter-apk/app-release.apk \
             piano-professor-${VERSION}.apk

      # ── Upload APK as workflow artifact (always available) ────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: piano-professor-apk
          path: piano-professor-*.apk
          retention-days: 30

      # ── Create GitHub Release + attach APK (tag pushes only) ─────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Piano Professor ${{ github.ref_name }}
          body: |
            ## Piano Professor ${{ github.ref_name }}

            ### Install on Android
            1. Download `piano-professor-${{ github.ref_name }}.apk` below
            2. On your Android device: Settings → Apps → Install unknown apps → allow your browser
            3. Open the downloaded APK to install

            ### What's in this release
            See commit history for changes since the previous tag.
          files: piano-professor-*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
