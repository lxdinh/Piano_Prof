<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Piano Professor — Component Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet" />
<style>
  :root { --green:#58CC02; --green-dark:#46A302; --cream:#FFFAEC; --gold:#F5B800; --sky:#5BB8E3; --streak:#FF7A52; --streak-dark:#C2410C; --error:#FF4B4B; --ink:#2D2A26; --line:#EAE0C4; }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; }
  body { background: #F4F0E4; background-image: radial-gradient(60% 50% at 50% 0, #FBF7EC, #F0EBDD); min-height: 100vh; }
  @keyframes pp-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes pp-shimmer { 0% { background-position: -300px 0; } 100% { background-position: 300px 0; } }
  input[type=range] { height: 8px; }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="20" fill="#58CC02"/>
      <rect x="28" y="30" width="44" height="14" rx="4" fill="#FFFAEC"/>
      <rect x="28" y="50" width="30" height="10" rx="3" fill="#F5B800"/>
      <rect x="28" y="64" width="38" height="10" rx="3" fill="#5BB8E3"/>
    </svg>
  </template>

  <div id="cs-root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="app/ds-core.jsx"></script>
  <script type="text/babel" src="app/ds-piano.jsx"></script>
  <script type="text/babel" src="app/data.jsx"></script>
  <script type="text/babel" src="app/component-sheet.jsx"></script>
</body>
</html>
