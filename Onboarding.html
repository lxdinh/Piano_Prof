<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Piano Professor — Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet" />
<style>
  :root {
    --green: #58CC02; --green-dark: #46A302;
    --cream: #FFFAEC; --gold: #F5B800; --sky: #5BB8E3;
    --streak: #FF7A52; --streak-dark: #C2410C; --error: #FF4B4B;
    --ink: #2D2A26; --line: #EAE0C4;
    --surface: #ffffff; --surface-2: #F7F1DE;
    --ink-soft: #79735F; --ink-faint: #A99F82;
    --nav-active: #E3F3FB; --seg-track: #EFE7CC; --seg-active: #ffffff;
    --sel-gold: #FFF7E0; --sel-green: #F1FCE6; --sel-sky: #EAF6FC;
    --lesson-bg: linear-gradient(180deg,#FFFDF6,#FFF3D6);
  }
  [data-theme="dark"] {
    --cream: #0E1A2C; --ink: #EAF2FC; --line: #2A4267;
    --surface: #16263E; --surface-2: #20375A;
    --ink-soft: #AEC2DE; --ink-faint: #6E88AD;
    --nav-active: #123C56; --seg-track: #182B45; --seg-active: #2B4670;
    --sel-gold: #33301B; --sel-green: #15331F; --sel-sky: #123247;
    --lesson-bg: radial-gradient(130% 120% at 50% 0%, #16273F 0%, #0A1424 72%);
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: Nunito, sans-serif; }
  body {
    background: #17140f;
    background-image: radial-gradient(60% 80% at 50% 0%, #2a2419 0%, #17140f 70%);
    overflow: hidden;
  }
  #pp-stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #pp-canvas {
    position: absolute; left: 50%; top: 50%;
    width: 1280px; height: 800px; transform-origin: center center;
    background: var(--cream); border-radius: 26px; overflow: hidden;
    box-shadow: 0 30px 80px #000a, 0 0 0 10px #0c0a07, 0 0 0 12px #2a2419;
  }
  [data-theme="dark"] #pp-canvas { background: #0E1A2C; }
  #pp-root { width: 100%; height: 100%; }

  .pp-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .pp-scroll { scrollbar-width: none; }

  /* dark-mode brand scene — midnight south-pole night */
  [data-theme="dark"] .pp-dark-scene {
    background:
      radial-gradient(95% 65% at 50% 116%, rgba(86,150,212,.40) 0%, transparent 60%),
      radial-gradient(120% 120% at 50% -8%, #173251 0%, #0A1320 72%) !important;
    position: relative;
  }
  [data-theme="dark"] .pp-dark-scene::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(2px 2px at 18% 26%, #d6e9ff, transparent),
      radial-gradient(2px 2px at 68% 16%, #bcd7ff, transparent),
      radial-gradient(1.5px 1.5px at 40% 10%, #ffffff, transparent),
      radial-gradient(2px 2px at 86% 36%, #cfe6ff, transparent),
      radial-gradient(1.5px 1.5px at 11% 56%, #bcd7ff, transparent),
      radial-gradient(2px 2px at 54% 30%, #cfe6ff, transparent);
    opacity: .85;
    animation: pp-icefloat 13s ease-in-out infinite alternate;
  }
  @keyframes pp-icefloat { from { transform: translateY(0); } to { transform: translateY(-9px); } }
  @keyframes pp-in-fwd { from { transform: translateX(46px); } to { transform: none; } }
  @keyframes pp-in-back { from { transform: translateX(-46px); } to { transform: none; } }
  .pp-enter-fwd { animation: pp-in-fwd .34s cubic-bezier(.2,.8,.2,1) both; }
  .pp-enter-back { animation: pp-in-back .34s cubic-bezier(.2,.8,.2,1) both; }

  /* shared keyframes */
  @keyframes pp-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes pp-pop { 0% { transform: scale(.7); } 100% { transform: scale(1); } }
  @keyframes pp-slide-up { from { transform: translateY(22px); } to { transform: none; } }
  @keyframes pp-twinkle { 0%,100% { transform: scale(.6); opacity: .3; } 50% { transform: scale(1.1); opacity: 1; } }
  @keyframes pp-jiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  @keyframes pp-toast { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes pp-pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: 1; } }
  @keyframes pp-spin { to { transform: rotate(360deg); } }
  @keyframes pp-dots { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
  @keyframes pp-bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }

  /* step launcher (review aid) */
  #pp-launch { position: fixed; right: 16px; bottom: 16px; z-index: 1000; font-family: Nunito, sans-serif; }
  #pp-launch-btn { display: flex; align-items: center; gap: 8px; padding: 11px 18px; border: none; cursor: pointer; background: #fff; color: #2D2A26; border-radius: 999px; font-weight: 900; font-size: 14px; box-shadow: 0 6px 20px #0006; }
  #pp-launch-panel { position: absolute; right: 0; bottom: 56px; width: 280px; max-height: 70vh; overflow-y: auto; background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 12px 40px #0007; display: none; }
  #pp-launch-panel.open { display: block; }
  .pp-lg { font-size: 11px; font-weight: 900; color: #A99F82; text-transform: uppercase; letter-spacing: .8px; margin: 12px 6px 6px; }
  .pp-li { display: block; width: 100%; text-align: left; border: none; background: #F7F1DE; margin: 4px 0; padding: 9px 12px; border-radius: 10px; font-family: Nunito; font-weight: 800; font-size: 14px; color: #2D2A26; cursor: pointer; }
  .pp-li:hover { background: #EAF8DC; }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="20" fill="#58CC02"/>
      <circle cx="50" cy="42" r="20" fill="#FFFAEC"/>
      <path d="M50 30 a12 12 0 0 1 0 24" fill="none" stroke="#F5B800" stroke-width="5"/>
      <rect x="34" y="64" width="32" height="6" rx="3" fill="#FFFAEC"/>
    </svg>
  </template>

  <div id="pp-stage">
    <div id="pp-canvas"><div id="pp-root"></div></div>
  </div>

  <div id="pp-launch">
    <button id="pp-launch-btn">☰ Steps</button>
    <div id="pp-launch-panel"></div>
  </div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Shared design system (from the main app) -->
  <script type="text/babel" src="app/ds-core.jsx"></script>
  <script type="text/babel" src="app/ds-piano.jsx"></script>
  <script type="text/babel" src="app/data.jsx"></script>

  <!-- Onboarding modules -->
  <script type="text/babel" src="onboarding/ob-voice.jsx"></script>
  <script type="text/babel" src="onboarding/ob-data.jsx"></script>
  <script type="text/babel" src="onboarding/ob-ui.jsx"></script>
  <script type="text/babel" src="onboarding/ob-screens.jsx"></script>
  <script type="text/babel" src="onboarding/ob-placement.jsx"></script>
  <script type="text/babel" src="onboarding/ob-app.jsx"></script>

  <!-- Tablet scaling -->
  <script>
    (function () {
      var canvas = document.getElementById("pp-canvas");
      function fit() {
        var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
        canvas.style.transform = "translate(-50%,-50%) scale(" + s + ")";
      }
      window.addEventListener("resize", fit); fit();
    })();
    document.addEventListener("pointerdown", function (e) {
      if (!window.PP_Audio) return;
      if (e.target.closest && e.target.closest("[data-noclk]")) return;
      var el = e.target, hit = false;
      for (var i = 0; i < 5 && el && el.nodeType === 1; i++) {
        if (el.tagName === "BUTTON") { hit = true; break; }
        try { if (getComputedStyle(el).cursor === "pointer") { hit = true; break; } } catch (_) {}
        el = el.parentElement;
      }
      if (hit) window.PP_Audio.tap();
    }, true);
  </script>
</body>
</html>
