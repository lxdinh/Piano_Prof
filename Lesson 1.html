<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Piano Professor — Lesson 1 Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --green: #58CC02; --green-dark: #46A302; --green-deep: #3D8E00;
    --cream: #FFFAEC; --gold: #F5B800; --sky: #5BB8E3;
    --streak: #FF7A52; --error: #FF4B4B;
    --ink: #2D2A26; --line: #EAE0C4;
    --surface: #ffffff; --surface-2: #F7F1DE;
    --ink-soft: #79735F; --ink-faint: #A99F82;
    --sel-green: #F1FCE6; --sel-sky: #EAF6FC;
    --lesson-bg: linear-gradient(180deg,#FFFDF6,#FFF3D6);
    --cyan: #00CDFF; --orange: #FF7A0A;
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: Nunito, "Segoe UI", sans-serif; }
  body {
    background: #17140f;
    background-image: radial-gradient(60% 80% at 50% 0%, #2a2419 0%, #17140f 70%);
    overflow: hidden;
  }
  a { color: #46A302; font-weight: 800; text-decoration: none; }
  a:hover { color: #3D8E00; text-decoration: underline; }
  #pp-stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #pp-canvas {
    position: absolute; left: 50%; top: 50%;
    width: 1280px; height: 800px; transform-origin: center center;
    background: var(--cream); border-radius: 26px; overflow: hidden;
    box-shadow: 0 30px 80px #000a, 0 0 0 10px #0c0a07, 0 0 0 12px #2a2419;
  }
  #app { width: 100%; height: 100%; position: relative; }

  /* ---------- shared keyframes ---------- */
  @keyframes pp-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes pp-pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes pp-jiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-2.4deg); } 75% { transform: rotate(2.4deg); } }
  @keyframes pp-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes pp-spin { to { transform: rotate(360deg); } }
  @keyframes pp-twinkle { 0%,100% { transform: scale(.6); opacity: .3; } 50% { transform: scale(1.1); opacity: 1; } }
  @keyframes pp-caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes pp-talk-ring { 0%,100% { box-shadow: 0 0 0 5px #fff, 0 0 0 8px #58CC0244; } 50% { box-shadow: 0 0 0 5px #fff, 0 0 0 15px #58CC0222; } }
  @keyframes pp-gate-pulse { 0%,100% { box-shadow: 0 5px 0 var(--green-deep), 0 0 0 0 #58CC0255; } 50% { box-shadow: 0 5px 0 var(--green-deep), 0 0 26px 6px #58CC0244; } }
  @keyframes pp-toast-in { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes pp-xp-fly { 0% { opacity: 0; transform: translateY(18px) scale(.7); } 20% { opacity: 1; transform: translateY(0) scale(1.15); } 80% { opacity: 1; transform: translateY(-46px) scale(1); } 100% { opacity: 0; transform: translateY(-70px) scale(.9); } }
  @keyframes pp-check-pop { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.25) rotate(4deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes pp-slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  .lesson { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--lesson-bg); overflow: hidden; }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 14px; padding: 14px 22px 6px; flex-shrink: 0; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 13px; border: none; cursor: pointer; flex-shrink: 0;
    background: transparent; display: grid; place-items: center; color: var(--ink-faint);
  }
  .icon-btn:hover { background: #00000009; color: var(--ink); }
  .progress { flex: 1; display: flex; gap: 6px; align-items: center; }
  .pseg { flex: 1; height: 14px; border-radius: 999px; background: var(--line); overflow: hidden; cursor: pointer; position: relative; }
  .pseg .fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(180deg,#6FE018,#58CC02); transition: width .4s cubic-bezier(.5,1.4,.5,1); position: relative; }
  .pseg .fill::after { content: ""; position: absolute; top: 2.5px; left: 6px; right: 6px; height: 4px; border-radius: 999px; background: #ffffff5c; }
  .pseg.cur { box-shadow: 0 0 0 2px #58CC0244; }
  .hud { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 13px 5px 9px;
    border-radius: 999px; border: 2px solid #00000010; background: var(--surface);
    box-shadow: 0 2px 0 #00000010; font-weight: 900; font-size: 16px; line-height: 1; position: relative;
  }
  .chip .em { font-size: 17px; }
  .chip.hearts { color: #C81E1E; }
  .chip.xp { color: #9A6E00; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--line); background: var(--surface); font-weight: 800; font-size: 13px; color: var(--ink-soft);
    box-shadow: 0 2px 0 #00000010; font-family: Nunito, sans-serif;
  }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: #B4AA8C; }
  .pill.ok { border-color: #CDEBAF; background: var(--sel-green); color: var(--green-dark); }
  .pill.ok .dot { background: var(--green); box-shadow: 0 0 6px 1px #58CC02aa; }
  .pill.bad { border-color: #F3D3BE; background: #FBEEE6; color: #C2410C; }
  .pill.bad .dot { background: #FF7A52; }
  .pill.wait .dot { background: var(--gold); animation: pp-pulse .8s infinite; }

  /* ---------- mid zone ---------- */
  .midzone { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 2px 26px 6px; position: relative; }
  .talkrow { display: flex; align-items: flex-start; gap: 16px; flex-shrink: 0; min-height: 118px; }
  .mascot-wrap { position: relative; width: 108px; height: 108px; flex-shrink: 0; }
  .mascot {
    width: 108px; height: 108px; border-radius: 50%; background: #FFF0CE; overflow: hidden;
    box-shadow: 0 0 0 5px #fff, 0 8px 20px #00000022; display: grid; place-items: center;
    animation: pp-float 3.4s ease-in-out infinite; transition: background .3s;
  }
  .mascot img { width: 100%; height: 100%; object-fit: contain; object-position: center 58%; }
  .noimg { display: grid !important; place-items: center; }
  .noimg::before { content: "🐧"; font-size: 52px; }
  .mascot.talking { animation: pp-float 3.4s ease-in-out infinite, pp-talk-ring 1.1s ease-in-out infinite; }
  .mascot.appear { animation: pp-pop .45s cubic-bezier(.3,1.6,.5,1) both, pp-float 3.4s .5s ease-in-out infinite; }
  .talk-dots { position: absolute; bottom: -3px; right: -3px; background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 5px 9px; display: none; gap: 4px; align-items: center; box-shadow: 0 3px 8px #0002; }
  .mascot-wrap.talking .talk-dots { display: inline-flex; }
  .talk-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pp-pulse .9s infinite; }
  .talk-dots i:nth-child(2) { animation-delay: .15s; } .talk-dots i:nth-child(3) { animation-delay: .3s; }

  .bubble {
    position: relative; flex: 1; max-width: 860px; background: var(--surface); border-radius: 22px;
    border: 2px solid var(--line); box-shadow: 0 5px 0 var(--line), 0 10px 22px #0000000a;
    padding: 18px 176px 18px 24px; min-height: 96px; display: flex; align-items: center;
  }
  .bubble::before {
    content: ""; position: absolute; left: -12px; top: 38px; width: 0; height: 0;
    border-top: 11px solid transparent; border-bottom: 11px solid transparent; border-right: 13px solid var(--line);
  }
  .bubble::after {
    content: ""; position: absolute; left: -9px; top: 39px; width: 0; height: 0;
    border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-right: 12px solid var(--surface);
  }
  .bubble-text { font-size: 25px; font-weight: 800; color: var(--ink); line-height: 1.32; margin: 0; text-wrap: pretty; }
  .bubble-text .caret { display: inline-block; width: 3px; height: 1.05em; vertical-align: -0.15em; margin-left: 2px; border-radius: 2px; background: var(--green); animation: pp-caret .8s step-end infinite; }
  .line-ctls { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; }
  .lbtn { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface-2); color: var(--ink-soft); cursor: pointer; display: grid; place-items: center; box-shadow: 0 2.5px 0 var(--line); transition: background .12s, color .12s, transform .05s, box-shadow .05s; }
  .lbtn:hover { color: var(--green-dark); border-color: #CDEBAF; background: var(--sel-green); }
  .lbtn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--line); }
  .lbtn.paused { background: #FF9600; border-color: #E08600; color: #fff; box-shadow: 0 2.5px 0 #CF7A00; }
  .lbtn.paused:hover { background: #FFA51E; border-color: #E08600; color: #fff; }

  /* ---------- stage (interaction area) ---------- */
  .stagezone { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  .stage-inner { width: 100%; display: flex; align-items: center; justify-content: center; }
  #next-host { position: absolute; right: 26px; bottom: 8px; z-index: 6; }

  /* tick counter */
  .ticks { display: flex; gap: 18px; align-items: center; animation: pp-slide-up .3s both; }
  .tick {
    width: 58px; height: 58px; border-radius: 50%; background: var(--surface); border: 3px dashed var(--line);
    display: grid; place-items: center; color: var(--ink-faint); font-weight: 900; font-size: 19px;
    transition: all .2s;
  }
  .tick.done { border: 3px solid var(--green-dark); background: linear-gradient(180deg,#6FE018,#58CC02); box-shadow: 0 3px 0 var(--green-deep); animation: pp-check-pop .4s cubic-bezier(.3,1.6,.5,1) both; }
  .tick svg { display: none; }
  .tick.done svg { display: block; }
  .tick.done span { display: none; }
  .ticks .tlabel { font-size: 16px; font-weight: 900; color: var(--ink-faint); margin-left: 8px; letter-spacing: .4px; }

  /* quiz */
  .quiz { display: flex; gap: 20px; align-items: stretch; animation: pp-slide-up .3s both; }
  .qopt {
    position: relative; width: 148px; padding: 26px 16px 20px; border-radius: 20px; cursor: pointer;
    background: var(--surface); border: 2.5px solid var(--line); box-shadow: 0 5px 0 var(--line);
    font-family: Nunito, sans-serif; text-align: center; transition: transform .1s, box-shadow .1s;
  }
  .qopt:hover { transform: translateY(-3px); }
  .qopt .letter { font-size: 46px; font-weight: 900; color: var(--ink); line-height: 1; }
  .qopt .sub { margin-top: 8px; font-size: 13px; font-weight: 800; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .8px; }
  .qopt.wrong { border-color: #FFB3B3; background: #FFF5F5; animation: pp-jiggle .4s; }
  .qopt.wrong .letter { color: #E05252; }
  .qopt .xlabel {
    display: none; position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%);
    background: var(--error); color: #fff; font-size: 12px; font-weight: 900; letter-spacing: .5px;
    padding: 4px 12px; border-radius: 999px; white-space: nowrap; box-shadow: 0 3px 0 #C81E1E;
  }
  .qopt.wrong .xlabel { display: block; animation: pp-pop .25s both; }
  .qopt.correct { border-color: var(--green); background: var(--sel-green); box-shadow: 0 5px 0 var(--green-deep); }
  .qopt .badge {
    display: none; position: absolute; top: -14px; right: -14px; width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(180deg,#6FE018,#58CC02); box-shadow: 0 3px 0 var(--green-deep), 0 6px 14px #58CC0266;
    place-items: center;
  }
  .qopt.correct .badge { display: grid; animation: pp-check-pop .45s cubic-bezier(.3,1.6,.5,1) both; }

  /* chunky button */
  .btn-chunky {
    border: none; cursor: pointer; font-family: Nunito, sans-serif; font-weight: 800; letter-spacing: .5px;
    text-transform: uppercase; color: #fff; border-radius: 18px; padding: 15px 34px; font-size: 19px;
    background: linear-gradient(180deg,#6FE018,#58CC02); box-shadow: 0 5px 0 var(--green-deep);
    transition: transform .05s, box-shadow .05s; display: inline-flex; align-items: center; gap: 10px;
  }
  .btn-chunky:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--green-deep); }
  .btn-chunky.glow { box-shadow: 0 5px 0 var(--green-deep), 0 8px 28px #58CC0266; animation: pp-gate-pulse 1.6s infinite; }
  .btn-chunky.sky { background: linear-gradient(180deg,#56B4E8,#2F9BD6); box-shadow: 0 5px 0 #1E6E99; animation: none; }
  .btn-chunky.sky:active { box-shadow: 0 1px 0 #1E6E99; }
  .btn-chunky.ghost { background: transparent; color: var(--ink-soft); border: 2px solid var(--line); box-shadow: none; text-transform: none; }
  .btn-chunky.gold { background: linear-gradient(180deg,#FFCB2E,#F5B800); box-shadow: 0 5px 0 #C28A00; color: #5a3d00; }
  .btn-chunky:disabled { opacity: .45; cursor: not-allowed; }

  /* follow the light */
  .follow { display: flex; flex-direction: column; align-items: center; gap: 16px; animation: pp-slide-up .3s both; }
  .follow .fchord { font-size: 64px; font-weight: 900; color: var(--green-dark); line-height: 1; min-height: 66px; text-shadow: 0 2px 0 #ffffff; }
  .follow .fdots { display: flex; gap: 10px; }
  .follow .fdot { width: 16px; height: 16px; border-radius: 50%; background: var(--line); transition: all .2s; }
  .follow .fdot.cur { background: var(--green); box-shadow: 0 0 10px 2px #58CC0288; transform: scale(1.25); }
  .follow .fdot.done { background: var(--green); }

  /* play-along timeline */
  .song { width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center; animation: pp-slide-up .3s both; }
  .song-head { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 900; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 1px; }
  .song-head .beats { display: flex; gap: 6px; }
  .song-head .beat { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .song-head .beat.on { background: var(--gold); box-shadow: 0 0 8px 1px #F5B80088; }
  .song-strip-clip { width: 100%; overflow: hidden; padding: 18px 0 6px; }
  .song-strip { display: flex; gap: 14px; transition: transform .45s cubic-bezier(.4,1,.4,1); padding: 0 8px; }
  .scard {
    flex-shrink: 0; width: 132px; border-radius: 18px; background: var(--surface); border: 2.5px solid var(--line);
    box-shadow: 0 5px 0 var(--line); padding: 14px 10px 12px; text-align: center; position: relative;
    transition: all .25s; opacity: .55;
  }
  .scard .cname { font-size: 42px; font-weight: 900; color: var(--ink-faint); line-height: 1; transition: color .25s; }
  .scard .clyric { margin-top: 7px; font-size: 12.5px; font-weight: 700; color: var(--ink-faint); line-height: 1.25; min-height: 31px; overflow: hidden; }
  .scard.preview { opacity: .9; border-color: #B5E48A; border-style: dashed; }
  .scard.preview .cname { color: var(--green-dark); }
  .scard.gate { opacity: 1; border-color: var(--green); transform: scale(1.06); animation: pp-gate-pulse 1s infinite; }
  .scard.gate .cname { color: var(--green-dark); }
  .scard.playing { opacity: 1; border-color: var(--green); background: var(--sel-green); box-shadow: 0 5px 0 var(--green-deep); transform: scale(1.06); }
  .scard.playing .cname { color: var(--green-dark); }
  .scard.done { opacity: .4; }
  .scard.done .cname { color: var(--ink-faint); }
  .scard .shand { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-weight: 900; letter-spacing: .5px; color: #B45309; background: #FFF3E4; border: 1.5px solid #FBD9AE; padding: 2px 9px; border-radius: 999px; white-space: nowrap; display: none; }
  .scard.gate .shand, .scard.playing .shand { display: block; }
  .scard .scheck { display: none; position: absolute; top: -11px; right: -11px; width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(180deg,#6FE018,#58CC02); box-shadow: 0 2px 0 var(--green-deep); place-items: center; }
  .scard.done .scheck, .scard.playing .scheck { display: grid; animation: pp-check-pop .4s both; }

  /* keyboard */
  .kbzone { flex-shrink: 0; padding: 0 18px 14px; }
  .kb-led {
    position: relative; height: 24px; margin: 0 6px 4px; border-radius: 8px;
    background: linear-gradient(180deg,#1a1814,#262019);
    box-shadow: inset 0 2px 4px #00000080, 0 1px 0 #ffffff10; border: 1px solid #00000060; overflow: hidden;
  }
  .kb-led .ldot {
    position: absolute; top: 50%; transform: translate(-50%,-50%);
    width: 11px; height: 11px; border-radius: 50%; background: #2a241c;
    box-shadow: inset 0 1px 2px #00000070; transition: background .12s, box-shadow .12s;
  }
  .kb-body {
    position: relative; border-radius: 14px; overflow: hidden;
    background: linear-gradient(180deg,#3a3128,#2a221a); padding: 0 5px 6px;
    box-shadow: 0 6px 16px #00000040, inset 0 2px 0 #00000060;
  }
  .kb-felt { height: 6px; background: linear-gradient(180deg,#8e1d1d,#b52a2a); border-radius: 0 0 3px 3px; margin-bottom: 2px; }
  .kb-keys { position: relative; height: 178px; }
  .kb-white-row { display: flex; height: 100%; gap: 2px; }
  .pk-w {
    flex: 1; position: relative; border-radius: 3px 3px 7px 7px;
    background: linear-gradient(180deg,#fffef9,#ece3cb);
    box-shadow: inset 0 -7px 10px #0000000f, inset 0 1px 0 #fff;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 6px;
    transition: transform .05s, box-shadow .12s, background .12s;
  }
  .pk-w .klabel { font-size: 10.5px; font-weight: 900; color: #C9BFA2; pointer-events: none; }
  .pk-w.down { transform: translateY(2px); background: linear-gradient(180deg,#EFFBE2,#CDEFAC); box-shadow: inset 0 -3px 6px #46A30333; }
  .pk-w.down .klabel { color: #46A302; }
  .pk-b {
    position: absolute; top: 0; height: 61%; border-radius: 2px 2px 6px 6px; z-index: 2;
    background: linear-gradient(180deg,#2a2a2a,#0c0c0c);
    box-shadow: 0 3px 4px #00000080, inset 0 -4px 6px #00000080, inset 0 1px 0 #ffffff30;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 5px;
    transition: transform .05s, box-shadow .12s, background .12s;
  }
  .pk-b.down { transform: translateY(2px); background: linear-gradient(180deg,#58CC02,#2f6b01); }
  .kb-interactive .pk-w, .kb-interactive .pk-b { cursor: pointer; }
  .pk-w .nname { font-size: 12px; font-weight: 900; color: #2a6b00; display: none; pointer-events: none; }
  .pk-b .nname { font-size: 9px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px #000; display: none; pointer-events: none; }
  .pk-w.lit .nname, .pk-b.lit .nname { display: block; }
  .pk-w.lit .klabel { display: none; }

  /* overlays */
  .overlay { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; }
  .overlay.scrim { background: rgba(20,16,10,.5); backdrop-filter: blur(5px); }
  .modal-card {
    background: var(--surface); border-radius: 26px; border: 2px solid var(--line);
    box-shadow: 0 24px 60px #00000055; padding: 30px 36px; text-align: center; animation: pp-pop .35s cubic-bezier(.3,1.4,.5,1) both;
  }
  .seg-toggle { display: inline-flex; background: #EFE7CC; border-radius: 15px; padding: 4px; gap: 4px; }
  .seg-toggle button {
    border: none; border-radius: 11px; padding: 9px 18px; cursor: pointer; font-family: Nunito, sans-serif;
    font-weight: 800; font-size: 14.5px; background: transparent; color: var(--ink-faint); transition: all .12s;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .seg-toggle button.on { background: var(--surface); color: var(--ink); box-shadow: 0 2px 0 var(--line); }

  .settings-pop {
    position: absolute; top: 62px; right: 20px; z-index: 60; width: 400px;
    background: var(--surface); border-radius: 20px; border: 2px solid var(--line);
    box-shadow: 0 18px 50px #00000038; padding: 18px 20px; animation: pp-pop .22s both; text-align: left;
  }
  .settings-pop h3 { margin: 0 0 4px; font-size: 13px; font-weight: 900; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 1px; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; }
  .set-row .lab { font-size: 15.5px; font-weight: 800; color: var(--ink); }
  .set-row .sub { font-size: 12.5px; font-weight: 700; color: var(--ink-faint); margin-top: 1px; }
  .switch { position: relative; width: 52px; height: 30px; border-radius: 999px; background: var(--line); cursor: pointer; transition: background .15s; border: none; flex-shrink: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px #0003; transition: left .15s; }
  .switch.on { background: var(--green); }
  .switch.on::after { left: 25px; }
  .kbd-help { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); line-height: 1.55; }
  .kbd-help b { color: var(--ink); }

<script>
/* ═══════════════════════════════════════════════════════════════════
   BLOCK 0 — SUPPORT: note utils + synth audio (presentation only)
   ═══════════════════════════════════════════════════════════════════ */
"use strict";
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function noteToMidi(name) {
  const m = /^([A-G]#?)(\d)$/.exec(name);
  if (!m) return -1;
  return (parseInt(m[2], 10) + 1) * 12 + NOTE_NAMES.indexOf(m[1]);
}
function midiToNote(midi) { return NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1); }
function isBlackKey(midi) { return [1, 3, 6, 8, 10].includes(midi % 12); }
const delay = (ms) => new Promise((r) => setTimeout(r, ms));
const LS_NS = "pp_lesson1_";

/* Small synth (same voice as the home-screen design system) */
const Synth = (() => {
  let ctx = null, master = null, muted = false, cues = false;   // cues OFF: voice + piano only
  const ensure = () => {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  };
  const midiToFreq = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const note = (midi, when = 0, dur = 2.2, vel = 0.8) => {
    if (muted) return;
    const c = ensure(); const t0 = c.currentTime + when; const f = midiToFreq(midi);
    const g = c.createGain(); const lp = c.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.setValueAtTime(4600, t0); lp.frequency.exponentialRampToValueAtTime(1400, t0 + dur);
    const o1 = c.createOscillator(); o1.type = "triangle"; o1.frequency.value = f;
    const o2 = c.createOscillator(); o2.type = "sine"; o2.frequency.value = f * 2.001;
    const g2 = c.createGain(); g2.gain.value = 0.22;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vel, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.42 * vel, t0 + 0.5);
    g.gain.exponentialRampToValueAtTime(0.16 * vel, t0 + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.5);
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(master);
    o1.start(t0); o2.start(t0); o1.stop(t0 + dur + 0.6); o2.stop(t0 + dur + 0.6);
  };
  const blip = (freq, dur = 0.12, type = "sine", vel = 0.4) => {
    if (muted) return;
    const c = ensure(); const t0 = c.currentTime;
    const o = c.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vel, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
  };
  return {
    ensure, note,
    chime: () => { note(79, 0, 0.5, 0.5); note(84, 0.09, 0.9, 0.55); },   // quiz "correct!" — always audible
    correct: () => { if (!cues) return; note(76, 0, 0.5, 0.55); note(81, 0.08, 0.7, 0.45); },
    success: () => { if (!cues) return; [72, 76, 79, 84].forEach((m, i) => note(m, i * 0.09, 0.9, 0.6)); },
    wrong: () => { if (!cues) return; blip(180, 0.18, "sawtooth", 0.26); blip(140, 0.22, "sawtooth", 0.22); },
    tap: () => { if (!cues) return; blip(880, 0.05, "sine", 0.14); },
    star: (i) => { if (!cues) return; note(72 + i * 4, 0, 1.0, 0.7); },
    setMuted: (m) => { muted = m; }, isMuted: () => muted,
    setCues: (v) => { cues = !!v; }, cuesEnabled: () => cues,
  };
})();
</script>

     chordWindowMs(base): number   // backend hint (sim + BLE both strict now)

   ── ESP32-S3 BLE GATT PROTOCOL (copy into firmware) ─────────────────
   Service UUID   7e400001-b5a3-f393-e0a9-e50e24dcca9e
   Char KEYS      7e400002-b5a3-f393-e0a9-e50e24dcca9e  (Notify, board→app)
       3-byte packets, may arrive concatenated (parse in strides of 3):
         [0x90, midiNote, velocity]  note-on  (velocity 0 treated as note-off)
         [0x80, midiNote, 0]         note-off
   Char LED       7e400003-b5a3-f393-e0a9-e50e24dcca9e  (WriteWithoutResponse, app→board)
         [0x01, count, (ledIndex, r, g, b) × count]   set LEDs (off = r,g,b = 0)
         [0x02]                                       clear all
         [0x03, effectId, count, ledIndex × count]    run effect on listed LEDs
       effectId: 1=redFlash (150ms red overlay, board restores its framebuffer)
                 2=pulse    (breathe current color until next SET on that LED)
                 3=rainbow  4=celebration (~2s full-strip shows; ignore ledIndex list content)
   Note↔LED index:  ledIndex = midiNote − 36   (C2=36→LED0 … B6=95→LED59)
                    valid 0–59. MIDI 96 (C7) has NO LED — commands for it are
                    silently skipped; C7 still counts as a key press.
   Rate limit: writes are coalesced per 60ms tick (≈16/s max), LED sets are
   chunked ≤14 LEDs per packet (58 bytes — negotiate MTU ≥ 64, ESP32 default 517).
   ─────────────────────────────────────────────────────────────────── */

const BLE = {
  SERVICE:   "7e400001-b5a3-f393-e0a9-e50e24dcca9e",
  CHAR_KEYS: "7e400002-b5a3-f393-e0a9-e50e24dcca9e",
  CHAR_LED:  "7e400003-b5a3-f393-e0a9-e50e24dcca9e",
};
const EFFECT_ID = { redFlash: 1, pulse: 2, rainbow: 3, celebration: 4 };
const LED_LOW_MIDI = 36, LED_HIGH_MIDI = 95, KEY_LOW_MIDI = 36, KEY_HIGH_MIDI = 96;
const noteToLedIndex = (midi) => (midi >= LED_LOW_MIDI && midi <= LED_HIGH_MIDI) ? midi - LED_LOW_MIDI : -1;
const LED_RGB = {
  green: [88, 204, 2], cyan: [0, 205, 255], yellow: [255, 199, 0],
  orange: [255, 122, 10], red: [255, 64, 64], white: [255, 244, 214],
};
const SIM_CHORD_WINDOW_MS = 1000;   // (unused — sim now enforces the strict window; kept for reference)
const SIM_CLICK_SUSTAIN_MS = 1000;  // clicked keys stay "held" this long
const ALL_LED_NOTES = (() => { const a = []; for (let m = LED_LOW_MIDI; m <= LED_HIGH_MIDI; m++) a.push(midiToNote(m)); return a; })();

/* App-side mirror of the strip — drives the on-screen LED strip in BOTH
   backends, and emulates the board-side effects (flash/pulse/rainbow). */
class LedModel {
  constructor() {
    this.base = new Map();      // midi -> [r,g,b] framebuffer
    this.flashes = new Map();   // midi -> flashUntil (ms)
    this.pulses = new Set();    // midi pulsing
    this.fx = null;             // {type, until} full-strip show
    this._subs = []; this._raf = null;
  }
  onChange(cb) { this._subs.push(cb); }
  _notify() {
    if (this._raf) return;
    this._raf = requestAnimationFrame(() => {
      this._raf = null;
      const snap = this.snapshot();
      this._subs.forEach((cb) => cb(snap));
      if (this._animating()) this._notify();
    });
  }
  _animating() {
    const now = performance.now();
    if (this.fx && now < this.fx.until) return true;
    if (this.pulses.size > 0) return true;
    for (const until of this.flashes.values()) if (now < until) return true;
    return false;
  }
  set(list) {
    list.forEach((l) => {
      const m = noteToMidi(l.note);
      if (noteToLedIndex(m) < 0) return;                 // C7 etc: silently skip
      if (l.r === 0 && l.g === 0 && l.b === 0) this.base.delete(m);
      else this.base.set(m, [l.r, l.g, l.b]);
      this.pulses.delete(m);                              // a SET stops the pulse
    });
    this._notify();
  }
  off(notes) { notes.forEach((n) => { const m = noteToMidi(n); this.base.delete(m); this.pulses.delete(m); }); this._notify(); }
  clear() { this.base.clear(); this.pulses.clear(); this.flashes.clear(); this.fx = null; this._notify(); }
  effect(name, notes) {
    const now = performance.now();
    if (name === "redFlash") {
      notes.forEach((n) => { const m = noteToMidi(n); if (noteToLedIndex(m) >= 0) this.flashes.set(m, now + WRONG_FLASH_MS); });
    } else if (name === "pulse") {
      notes.forEach((n) => { const m = noteToMidi(n); if (this.base.has(m)) this.pulses.add(m); });
    } else {
      this.fx = { type: name, until: now + 2000 };
    }
    this._notify();
  }
  snapshot() {   // Map midi -> css color visible right now (null-ish = off)
    const out = new Map(); const now = performance.now();
    if (this.fx && now < this.fx.until) {
      for (let m = LED_LOW_MIDI; m <= LED_HIGH_MIDI; m++) {
        const hue = (((m - 36) * 7) - now / 3.5) % 360;
        out.set(m, `hsl(${hue}, 95%, 55%)`);
      }
      return out;
    }
    this.base.forEach((rgb, m) => {
      let [r, g, b] = rgb;
      if (this.pulses.has(m)) { const f = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(now / 150)); r *= f; g *= f; b *= f; }
      out.set(m, `rgb(${r | 0},${g | 0},${b | 0})`);
    });
    this.flashes.forEach((until, m) => { if (now < until) out.set(m, "rgb(255,64,64)"); else this.flashes.delete(m); });
    return out;
  }
}

/* Shared backend base — event plumbing + LED mirror. Subclasses override _tx*. */
class PianoBackend {
  constructor() {
    this._onCbs = []; this._offCbs = []; this._statusCbs = [];
    this.leds = new LedModel();
    this.status = { state: "idle", detail: "" };
  }
  onNoteOn(cb) { this._onCbs.push(cb); }
  onNoteOff(cb) { this._offCbs.push(cb); }
  _emitOn(midi, vel) { if (midi < KEY_LOW_MIDI || midi > KEY_HIGH_MIDI) return; const n = midiToNote(midi); this._onCbs.forEach((cb) => cb(n, vel)); }
  _emitOff(midi) { if (midi < KEY_LOW_MIDI || midi > KEY_HIGH_MIDI) return; const n = midiToNote(midi); this._offCbs.forEach((cb) => cb(n)); }
  onStatus(cb) { this._statusCbs.push(cb); cb(this.status); }
  _setStatus(state, detail) { this.status = { state, detail: detail || "" }; this._statusCbs.forEach((cb) => cb(this.status)); }
  async connect() {}
  dispose() {}
  chordWindowMs(base) { return base; }
  /* PianoHardware LED API */
  ledSet(list) { this.leds.set(list); this._txSet(list); }
  ledOn(note, r, g, b) { this.ledSet([{ note, r, g, b }]); }
  ledOff(note) { this.ledOffMany([note]); }
  ledOffMany(notes) { this.leds.off(notes); this._txSet(notes.map((n) => ({ note: n, r: 0, g: 0, b: 0 }))); }
  ledClear() { this.leds.clear(); this._txClear(); }
  ledEffect(effect, notes) { this.leds.effect(effect, notes); this._txEffect(effect, notes); }
  _txSet(list) {} _txClear() {} _txEffect(effect, notes) {}
}

/* 1 ── BLEPiano — the real ESP32-S3 board over Web Bluetooth */
class BLEPiano extends PianoBackend {
  constructor() {
    super();
    this.device = null; this.charLed = null;
    this._pending = new Map();   // ledIndex -> [r,g,b]  (coalesced)
    this._fxQueue = []; this._clearAll = false; this._timer = null;
    this._setStatus("idle", "Not connected");
  }
  async connect() {
    if (!navigator.bluetooth) {
      this._setStatus("error", "Web Bluetooth unavailable — use Chrome/Edge over HTTPS");
      throw new Error("Web Bluetooth not available");
    }
    try {
      this._setStatus("connecting", "Choose your board in the picker…");
      this.device = await navigator.bluetooth.requestDevice({ filters: [{ services: [BLE.SERVICE] }] });
      this.device.addEventListener("gattserverdisconnected", () => this._setStatus("disconnected", "Connection lost"));
      this._setStatus("connecting", "Connecting to " + (this.device.name || "board") + "…");
      const server = await this.device.gatt.connect();
      const svc = await server.getPrimaryService(BLE.SERVICE);
      const chKeys = await svc.getCharacteristic(BLE.CHAR_KEYS);
      this.charLed = await svc.getCharacteristic(BLE.CHAR_LED);
      await chKeys.startNotifications();
      chKeys.addEventListener("characteristicvaluechanged", (e) => this._onPacket(e.target.value));
      this._startFlush();
      this._setStatus("connected", this.device.name || "ESP32-S3");
    } catch (err) {
      if (this.status.state !== "error") this._setStatus("error", err.message || "Connection failed");
      throw err;
    }
  }
  dispose() {
    if (this._timer) { clearInterval(this._timer); this._timer = null; }
    try { if (this.device && this.device.gatt.connected) this.device.gatt.disconnect(); } catch (e) {}
  }
  _onPacket(dv) {
    for (let i = 0; i + 2 < dv.byteLength; i += 3) {
      const st = dv.getUint8(i), note = dv.getUint8(i + 1), vel = dv.getUint8(i + 2);
      if (st === 0x90 && vel > 0) this._emitOn(note, vel);
      else if (st === 0x80 || (st === 0x90 && vel === 0)) this._emitOff(note);
    }
  }
  /* coalesced TX — never more than ~16 writes/second */
  _txSet(list) {
    list.forEach((l) => {
      const idx = noteToLedIndex(noteToMidi(l.note));
      if (idx < 0) return;                                // C7: silently skip
      this._pending.set(idx, [l.r, l.g, l.b]);
    });
  }
  _txClear() { this._pending.clear(); this._clearAll = true; }
  _txEffect(effect, notes) {
    const id = EFFECT_ID[effect]; if (!id) return;
    const idxs = notes.map((n) => noteToLedIndex(noteToMidi(n))).filter((i) => i >= 0);
    if (!idxs.length && effect !== "rainbow" && effect !== "celebration") return;
    this._fxQueue.push([0x03, id, idxs.length, ...idxs]);
  }
  _startFlush() { if (!this._timer) this._timer = setInterval(() => this._flush(), 60); }
  async _flush() {
    if (!this.charLed || !this.device || !this.device.gatt.connected) return;
    try {
      if (this._clearAll) { this._clearAll = false; await this._write([0x02]); }
      while (this._fxQueue.length) await this._write(this._fxQueue.shift());
      if (this._pending.size) {
        const entries = [...this._pending]; this._pending.clear();
        for (let i = 0; i < entries.length; i += 14) {
          const chunk = entries.slice(i, i + 14);
          const bytes = [0x01, chunk.length];
          chunk.forEach(([idx, rgb]) => bytes.push(idx, rgb[0], rgb[1], rgb[2]));
          await this._write(bytes);
        }
      }
    } catch (e) { /* dropped write — next engine command refreshes state */ }
  }
  _write(bytes) { return this.charLed.writeValueWithoutResponse(new Uint8Array(bytes)); }
}

/* 2 ── SimulatorPiano — on-screen 61-key board, no hardware needed */
class SimulatorPiano extends PianoBackend {
  constructor() {
    super();
    this.held = new Map();   // midi -> {downAt, timer}
    this._setStatus("sim", "Simulator — click keys, or play your computer keyboard");
  }
  async connect() { this._setStatus("sim", "Simulator ready"); }
  chordWindowMs(base) { return base; }   // strict 200ms in sim too — use the computer keyboard (A S D F …) for chords
  /* click / tap: press now, auto-release after 1s so sequential clicks build chords */
  press(midi) {
    if (midi < KEY_LOW_MIDI || midi > KEY_HIGH_MIDI) return;
    const rec = this.held.get(midi);
    if (rec) { clearTimeout(rec.timer); this.held.delete(midi); this._emitOff(midi); }
    this._emitOn(midi, 100);
    this.held.set(midi, { downAt: performance.now(), timer: setTimeout(() => this.release(midi), SIM_CLICK_SUSTAIN_MS) });
  }
  /* computer-keyboard: hold while key is down, minimum hold = 1s */
  keyDown(midi) {
    if (midi < KEY_LOW_MIDI || midi > KEY_HIGH_MIDI || this.held.has(midi)) return;
    this._emitOn(midi, 100);
    this.held.set(midi, { downAt: performance.now(), timer: null });
  }
  keyUp(midi) {
    const rec = this.held.get(midi); if (!rec) return;
    const elapsed = performance.now() - rec.downAt;
    const wait = Math.max(0, SIM_CLICK_SUSTAIN_MS - elapsed);
    clearTimeout(rec.timer);
    rec.timer = setTimeout(() => this.release(midi), wait);
  }
  release(midi) {
    const rec = this.held.get(midi); if (!rec) return;
    clearTimeout(rec.timer); this.held.delete(midi); this._emitOff(midi);
  }
  dispose() { [...this.held.keys()].forEach((m) => this.release(m)); }
}

/* HW — facade implementing PianoHardware; swaps backends behind stable listeners */
const HW = {
  backend: null, mode: null,
  _on: [], _off: [], _status: [], _led: [],
  setMode(mode) {
    if (this.backend) { try { this.backend.ledClear(); this.backend.dispose(); } catch (e) {} }
    this.mode = mode;
    this.backend = mode === "ble" ? new BLEPiano() : new SimulatorPiano();
    this.backend.onNoteOn((n, v) => this._on.forEach((cb) => cb(n, v)));
    this.backend.onNoteOff((n) => this._off.forEach((cb) => cb(n)));
    this.backend.onStatus((s) => this._status.forEach((cb) => cb(s)));
    this.backend.leds.onChange((snap) => this._led.forEach((cb) => cb(snap)));
    try { localStorage.setItem(LS_NS + "mode", mode); } catch (e) {}
    this._led.forEach((cb) => cb(this.backend.leds.snapshot()));
  },
  /* ── PianoHardware interface (all the engine ever calls) ── */
  connect() { return this.backend.connect(); },
  onNoteOn(cb) { this._on.push(cb); },
  onNoteOff(cb) { this._off.push(cb); },
  ledSet(l) { this.backend.ledSet(l); },
  ledOn(n, r, g, b) { this.backend.ledOn(n, r, g, b); },
  ledOff(n) { this.backend.ledOff(n); },
  ledOffMany(ns) { this.backend.ledOffMany(ns); },
  ledClear() { this.backend.ledClear(); },
  ledEffect(e, ns) { this.backend.ledEffect(e, ns); },
  chordWindowMs(b) { return this.backend.chordWindowMs(b); },
  /* ── app-side extras (UI only, not used by the engine) ── */
  onStatus(cb) { this._status.push(cb); if (this.backend) cb(this.backend.status); },
  onLed(cb) { this._led.push(cb); if (this.backend) cb(this.backend.leds.snapshot()); },
};
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   BLOCK 3 — ENGINE  (speech + segment interpreter)
   Steps through LESSONS[n].steps[].segments[] in order. Talks ONLY to
   the PianoHardware interface (HW facade) — no backend-specific code.
   Global rules: never advance on a miss · wrong key = 150ms red flash,
   progress kept · chord window 200ms · C7 has
   no LED but counts as a key press · typeSay text persists until next.
   ═══════════════════════════════════════════════════════════════════ */

const Speech = (() => {
  const supported = "speechSynthesis" in window;
  let voice = null, muted = false, current = null;
  function pickVoice() {
    if (!supported) return;
    const vs = speechSynthesis.getVoices();
    voice = vs.find((v) => /en[-_]US/i.test(v.lang) && /google/i.test(v.name))
         || vs.find((v) => /en[-_]US/i.test(v.lang))
         || vs.find((v) => /^en/i.test(v.lang)) || null;
  }
  if (supported) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  const estimate = (text, rate = 1) => (500 + text.length * 62) / rate;
  let pausedFlag = false, activeSpeak = null;   // activeSpeak = watchdog hooks of the in-flight utterance
  function cancel() {
    if (supported) { try { speechSynthesis.resume(); } catch (e) {} try { speechSynthesis.cancel(); } catch (e) {} }
    pausedFlag = false;
    if (current) { const f = current; current = null; f(); }
  }
  /* stop button: freeze the voice mid-word — resume() picks up exactly there */
  function pause() {
    pausedFlag = true;
    if (activeSpeak) activeSpeak.freeze();               // suspend the watchdog while frozen
    if (supported) { try { speechSynthesis.pause(); } catch (e) {} }
  }
  function resume() {
    if (!pausedFlag) return;
    pausedFlag = false;
    if (activeSpeak) activeSpeak.thaw();
    if (supported) { try { speechSynthesis.resume(); } catch (e) {} }
  }
  function speak(text, { rate = 1.0, onBoundary, interrupt } = {}) {
    return new Promise((resolve) => {
      const est = estimate(text, rate);
      if (muted || !supported) {
        const t = setTimeout(() => { if (current === fin) current = null; resolve(); }, Math.min(est, 350 + text.length * 30));
        const fin = () => { clearTimeout(t); resolve(); };
        current = fin;
        return;
      }
      if (interrupt) { try { speechSynthesis.cancel(); } catch (e) {} }
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = "en-US"; u.rate = rate; u.pitch = 1.12; u.volume = 0.95;
      let done = false, safety = null;
      const me = { freeze: () => clearTimeout(safety), thaw: () => { if (!done) safety = setTimeout(finish, est * 1.8 + 1600); } };
      const finish = () => { if (done) return; done = true; clearTimeout(safety); if (activeSpeak === me) activeSpeak = null; if (current === finish) current = null; resolve(); };
      if (!pausedFlag) safety = setTimeout(finish, est * 1.8 + 1600);
      u.onend = finish; u.onerror = finish;
      if (onBoundary) u.onboundary = (e) => { try { onBoundary(e.charIndex || 0); } catch (err) {} };
      current = finish; activeSpeak = me;
      try { speechSynthesis.speak(u); } catch (e) { finish(); }
    });
  }
  return { speak, cancel, pause, resume, estimate, setMuted: (m) => { muted = m; if (m) cancel(); }, isMuted: () => muted };
})();

const CHORD_NAME_LOOKUP = (() => {
  const m = {};
  Object.keys(CHORDS).forEach((name) => {
    m[CHORDS[name].right.join(",")] = name;
    m[[CHORDS[name].left, ...CHORDS[name].right].join(",")] = name;
  });
  return m;
})();
const chordDisplayName = (notes) => CHORD_NAME_LOOKUP[notes.join(",")] || notes.map((n) => n.replace(/\d/g, "")).join("·");

/* simple synthesized backing for playAlong (bass + soft pad per bar) */
const Backing = {
  bar(chordName, barMs, force) {
    if (!force && !Synth.cuesEnabled()) return;   // demo forces the beat on; user turn follows the sfx toggle
    const ch = CHORDS[chordName]; if (!ch) return;
    const beat = barMs / 4 / 1000;
    const bass = noteToMidi(ch.left) - 12;
    const triad = ch.right.map(noteToMidi);
    Synth.note(bass, 0, beat * 2.2, 0.32);
    Synth.note(bass, beat * 2, beat * 2.2, 0.26);
    for (let b = 0; b < 4; b++) triad.forEach((mm, i) => Synth.note(mm + 12, b * beat + i * 0.012, beat * 0.85, 0.09));
  },
  stop() {},
};

/* Real singer's voice — drop MP3s at these paths and they play automatically
   (no speech-synth singing). Missing file = songs simply run without vocals. */
const VOCALS = {
  small_town_girl: "assets/audio/small_town_girl.mp3",
  love_story: "assets/audio/love_story.mp3",
  dont_stop_believin_chorus: "assets/audio/dont_stop_believin_chorus.mp3",
};
const VocalPlayer = (() => {
  const cache = new Map();   // song -> HTMLAudioElement
  let active = null;
  function get(song) {
    if (!VOCALS[song]) return null;
    if (!cache.has(song)) { const a = new Audio(VOCALS[song]); a.preload = "auto"; cache.set(song, a); }
    return cache.get(song);
  }
  return {
    /* keep the track rolling, re-seeking only if it drifted from the bar position */
    syncTo(song, ms, vol) {
      const a = get(song); if (!a) return;
      active = a; a.volume = vol == null ? 0.95 : vol;
      const target = ms / 1000;
      if (a.paused || Math.abs(a.currentTime - target) > 0.3) { try { a.currentTime = target; } catch (e) {} }
      a.play().catch(() => {});   // file missing / still loading → silent, no crash
    },
    playing() { return !!(active && !active.paused); },
    pause() { if (active) { try { active.pause(); } catch (e) {} } },
    resume() { if (active) { try { active.play().catch(() => {}); } catch (e) {} } },
    stop() { if (active) { try { active.pause(); active.currentTime = 0; } catch (e) {} active = null; } },
  };
})();

const SONG_TITLES = {
  small_town_girl: "Don't Stop Believin' — Journey (verse)",
  love_story: "Love Story — Taylor Swift",
  dont_stop_believin_chorus: "Don't Stop Believin' — chorus · + left hand",
};
const SONG_BPM = 104, SONG_BEATS = 4;

class LessonEngine {
  constructor(lesson, hal, ui) {
    this.L = lesson; this.hal = hal; this.ui = ui;
    this.stepIdx = 0; this.run = 0;
    this.waiter = null; this._skip = null; this._skipAll = false;
    this.xp = 0; this.held = new Map();   // note name -> noteOn time (ms)
    this._lastInterject = 0;
    this.lastLine = ""; this._segSpeaking = false; this._replayReq = false;
    this.paused = false; this._resume = null; this.trail = [];
    hal.onNoteOn((note) => this._noteOn(note));
    hal.onNoteOff((note) => this._noteOff(note));
  }
  _noteOn(note) {
    const t = performance.now();
    this.held.set(note, t);
    const w = this.waiter;
    if (w && w.down) { try { w.down(note, t); } catch (e) { console.error(e); } }
  }
  _noteOff(note) {
    this.held.delete(note);
    const w = this.waiter;
    if (w && w.up) { try { w.up(note); } catch (e) { console.error(e); } }
  }

  start(step = 0) { this.gotoStep(step); }

  async gotoStep(i, fromSeg = 0) {
    const tk = ++this.run;
    this.waiter = null; this._skip = null; this._skipAll = false;
    this.paused = false;                                               // leaving a pause behind: release + reset
    if (this._resume) { const r = this._resume; this._resume = null; r(); }
    this.ui.setPaused(false); this.ui.setTypePaused(false);
    Speech.cancel(); this.hal.ledClear(); Backing.stop(); VocalPlayer.stop();
    this.ui.clearStage(); this.ui.hideComplete(); this.ui.mascotTalking(false);
    this.stepIdx = i;
    this.trail = this.trail.filter((e) => e.step < i || (e.step === i && e.seg < fromSeg));
    try { localStorage.setItem(LS_NS + "step", String(i)); } catch (e) {}
    const step = this.L.steps[i];
    for (let s = 0; s < fromSeg; s++) {                                // jumping mid-step: rebuild LED state instantly
      const sg = step.segments[s];
      if (sg.type === "ledOn") this.segLedOn(sg);
      else if (sg.type === "ledOff") sg.notes === "all" ? this.hal.ledClear() : this.hal.ledOffMany(sg.notes);
    }
    for (let s = fromSeg; s < step.segments.length; s++) {
      if (this.run !== tk) return;
      while (this.paused) { await this._gate(); if (this.run !== tk) return; }   // stop button: hold here until resumed
      const sg = step.segments[s];
      if (sg.type === "typeSay" || sg.type === "say" || sg.type === "sayWithSeq" || sg.type === "quiz") this._trailPush(i, s);
      this.ui.progress(i, s, step.segments.length);
      try { await this.exec(sg, tk); } catch (e) { console.error("segment failed", sg, e); }
      if (this.run !== tk) return;
      this._skipAll = false;
    }
    this.ui.progress(i, step.segments.length, step.segments.length);
    if (i + 1 < this.L.steps.length) this.gotoStep(i + 1);
  }

  /* dev fast-forward: resolves the current speech / pause / wait */
  skip() { const f = this._skip; if (f) { this._skip = null; f(); } }

  skippable(promise, onSkip) {
    return new Promise((resolve) => {
      let done = false;
      const finish = () => { if (done) return; done = true; if (this._skip === hook) this._skip = null; this.waiter = null; resolve(); };
      const hook = () => { try { onSkip && onSkip(); } catch (e) {} finish(); };
      this._skip = hook;
      Promise.resolve(promise).then(finish, finish);
    });
  }
  waitSegment(setup, onSkip) {
    let resolveDone;
    const p = new Promise((r) => { resolveDone = r; });
    const waiter = setup(() => resolveDone()) || {};
    this.waiter = waiter;
    if (waiter.init) waiter.init();
    return this.skippable(p, onSkip);
  }
  sleep(ms, onSkip) { return this.skippable(delay(ms), onSkip); }

  async exec(seg, tk) {
    switch (seg.type) {
      case "mascot": this.ui.mascotAppear(); return this.sleep(400);
      case "typeSay": return this.typeSay(seg.text, seg.rate);
      case "say": return this.typeSay(seg.text, seg.rate);   // every spoken line is written out
      case "pause": return this.sleep(seg.ms);
      case "ledOn": return this.segLedOn(seg);
      case "ledOff": seg.notes === "all" ? this.hal.ledClear() : this.hal.ledOffMany(seg.notes); return;
      case "sayWithSeq": return this.sayWithSeq(seg);
      case "waitPressCount": return this.waitPressCount(seg);
      case "waitPressAll": return this.waitPressAll(seg);
      case "waitPressOrdered": return this.waitPressOrdered(seg);
      case "waitPressAny": return this.waitPressAny(seg);
      case "waitChord": return this.waitChord(seg);
      case "waitChordCount": return this.waitChordCount(seg, tk);
      case "followLight": return this.followLight(seg, tk);
      case "songDemo": return this.songDemo(seg, tk);
      case "playAlong": return this.playAlong(seg, tk);
      case "quiz": return this.quiz(seg);
      case "nextButton": return this.nextButton();
      case "awardXP": return this.awardXP(seg.amount);
      case "lessonCompleteScreen":
        try { localStorage.removeItem(LS_NS + "step"); } catch (e) {}
        this.ui.completeScreen(this.xp);   // silent — no voice-over on this screen
        return;
      default: console.warn("unknown segment type", seg.type);
    }
  }

  /* ---- speech segments ---- */
  async typeSay(text, rate) {
    this.lastLine = text;
    const r = this.run;
    do {
      this._replayReq = false;
      this._segSpeaking = true;
      this.ui.mascotTalking(true);
      const both = Promise.all([Speech.speak(text, { rate }), this.ui.typeText(text)]);
      await this.skippable(both, () => { this._replayReq = false; Speech.cancel(); this.ui.typeTextInstant(text); });
    } while (this._replayReq && this.run === r);
    this._segSpeaking = false;
    this.ui.mascotTalking(false);
  }
  /* line controls — pause/resume, previous line, replay */
  _gate() { return this.paused ? new Promise((r) => { this._resume = r; }) : Promise.resolve(); }
  pauseToggle() {
    if (this.paused) {                                   // resume — voice picks up exactly where it stopped
      this.paused = false; this.ui.setPaused(false); this.ui.setTypePaused(false);
      Speech.resume();
      if (this._vocalWasPlaying) VocalPlayer.resume(); this._vocalWasPlaying = false;
      const r = this._resume; this._resume = null; if (r) r();
    } else {                                             // stop — freeze voice + typewriter in place
      this.paused = true; this.ui.setPaused(true); this.ui.setTypePaused(true);
      Speech.pause();
      this._vocalWasPlaying = VocalPlayer.playing(); VocalPlayer.pause();
    }
  }
  _trailPush(step, seg) {
    const last = this.trail[this.trail.length - 1];
    if (last && last.step === step && last.seg === seg) return;
    this.trail.push({ step, seg });
    if (this.trail.length > 300) this.trail.shift();
  }
  prevLine() {                                           // back to the last line the user heard
    if (this.trail.length > 1) this.trail.pop();
    const t = this.trail[this.trail.length - 1];
    if (t) this.gotoStep(t.step, t.seg);
  }
  replayLine() {
    if (this.paused) return;
    const text = this.lastLine;
    if (!text) return;
    if (this._segSpeaking) { this._replayReq = true; Speech.cancel(); return; }   // mid-line → restart it
    Speech.cancel();
    this.ui.mascotTalking(true);
    this.ui.typeText(text);
    Speech.speak(text, { interrupt: true }).then(() => { if (!this._segSpeaking) this.ui.mascotTalking(false); });
  }
  sayInterject(text) {
    const now = performance.now();
    if (now - this._lastInterject < 1600) return;
    this._lastInterject = now;
    this.ui.typeText(text);   // written out, same as spoken
    this.ui.mascotTalking(true);
    Speech.speak(text, { interrupt: true }).then(() => this.ui.mascotTalking(false));
  }

  /* ---- LED segments ---- */
  segLedOn(seg) {
    if (seg.effect || seg.color === "rainbow") {
      this.hal.ledEffect(seg.effect || "rainbow", seg.notes === "all" ? ALL_LED_NOTES : seg.notes);
      return;
    }
    const rgb = LED_RGB[seg.color] || LED_RGB.green;
    const notes = seg.notes === "all" ? ALL_LED_NOTES : seg.notes;
    this.hal.ledSet(notes.map((n) => ({ note: n, r: rgb[0], g: rgb[1], b: rgb[2] })));
  }
  /* speaks the line in chunks — each note-name / number word is its own
     utterance, and its LED lights the instant that word is spoken. */
  async sayWithSeq(seg) {
    const rgb = LED_RGB[seg.color] || LED_RGB.green;
    const notes = seg.notes;
    this.lastLine = seg.text;
    const r = this.run;
    do {
      this._replayReq = false; this._segSpeaking = true;
      this.ui.mascotTalking(true);
      const allOn = () => this.hal.ledSet(notes.map((n) => ({ note: n, r: rgb[0], g: rgb[1], b: rgb[2] })));
      if (!seg.syncPerWord) {
        allOn();
        await this.skippable(Promise.all([Speech.speak(seg.text, { rate: seg.rate }), this.ui.typeText(seg.text)]),
          () => { this._replayReq = false; Speech.cancel(); this.ui.typeTextInstant(seg.text); });
      } else {
        this.hal.ledOffMany(notes);   // re-light one-by-one even if already lit
        const parts = [];             // split the line at note-name / number words
        const re = /\S+/g; let m, buf = "", ni = 0;
        while ((m = re.exec(seg.text))) {
          const cleaned = m[0].replace(/[^A-G0-9#]/g, "");
          if (ni < notes.length && (/^[A-G]$/.test(cleaned) || /^[1-9]$/.test(cleaned))) {
            if (buf) parts.push({ text: buf, note: -1 });
            parts.push({ text: m[0], note: ni++ }); buf = "";
          } else buf = buf ? buf + " " + m[0] : m[0];
        }
        if (buf) parts.push({ text: buf, note: -1 });
        let cancelled = false;
        const speakSeq = (async () => {
          for (const p of parts) {
            while (this.paused && this.run === r && !cancelled) await this._gate();
            if (cancelled || this.run !== r || this._replayReq) return;
            if (p.note >= 0) this.hal.ledOn(notes[p.note], rgb[0], rgb[1], rgb[2]);
            await Speech.speak(p.text, { rate: seg.rate });
          }
        })();
        await this.skippable(Promise.all([speakSeq, this.ui.typeText(seg.text)]),
          () => { cancelled = true; this._replayReq = false; Speech.cancel(); this.ui.typeTextInstant(seg.text); });
        allOn();   // ensure all lit at the end
      }
    } while (this._replayReq && this.run === r);
    this._segSpeaking = false;
    this.ui.mascotTalking(false);
  }

  /* ---- wrong-key feedback (global rule 2) ---- */
  wrongKey(note, opts) {
    this.hal.ledEffect("redFlash", [note]);   // C7 has no LED — HAL skips silently
    Synth.wrong();
    this.ui.mood("nervous", 1100);
    if (opts && opts.say) this.sayInterject(opts.say);
  }

  /* ---- single-key waits ---- */
  waitPressCount(seg) {
    const t = this.ui.showTicks(seg.count);
    let n = 0;
    return this.waitSegment((done) => ({
      down: (note) => {
        if (note === seg.note) {
          n++; Synth.correct(); t.fill(n);
          if (n >= seg.count) { t.success(); this.ui.mood("cheer", 1200); this.ui.clearStageSoon(900); done(); }
        } else this.wrongKey(note, seg.onWrongKey);
      },
    }), () => { t.fill(seg.count); t.success(); this.ui.clearStageSoon(300); });
  }
  waitPressAll(seg) {
    const remain = new Set(seg.notes);
    return this.waitSegment((done) => ({
      down: (note) => {
        if (remain.has(note)) {
          remain.delete(note); Synth.tap();
          if (seg.turnOffOnPress) this.hal.ledOff(note);
          if (!remain.size) { this.ui.mood("cheer", 1000); done(); }
        } else if (!seg.notes.includes(note)) this.wrongKey(note, seg.onWrongKey);
      },
    }), () => { this.hal.ledOffMany(seg.notes); });
  }
  waitPressOrdered(seg) {
    let k = 0;
    return this.waitSegment((done) => ({
      down: (note) => {
        if (note === seg.notes[k]) {
          if (seg.turnOffOnPress) this.hal.ledOff(note);
          k++; Synth.tap();
          if (k >= seg.notes.length) { this.ui.mood("cheer", 1000); done(); }
        } else this.wrongKey(note, seg.onWrongOrder);   // LED stays on, red flash only
      },
    }), () => { this.hal.ledOffMany(seg.notes); });
  }
  waitPressAny(seg) {
    return this.waitSegment((done) => ({
      down: (note) => {
        if (seg.notes.includes(note)) { Synth.correct(); this.ui.mood("cheer", 900); done(); }
        else this.wrongKey(note, seg.onWrongKey);
      },
    }), () => {});
  }

  /* ---- chord waits ----
     success = every target down within `win`, no extra keys held
     (extras ignored during songs). Sloppy attempt → must fully release. */
  makeChordWaiter(targetNotes, opts, onSuccess) {
    const win = this.hal.chordWindowMs(opts.win || CHORD_WINDOW_MS);
    const target = new Set(targetNotes);
    let blocked = false;
    const anyHeld = () => targetNotes.some((n) => this.held.has(n));
    const tryComplete = () => {
      if (blocked) return;
      for (const n of target) if (!this.held.has(n)) return;
      const times = targetNotes.map((n) => this.held.get(n));
      const spread = Math.max(...times) - Math.min(...times);
      const extras = [...this.held.keys()].filter((n) => !target.has(n));
      if (spread <= win && (opts.ignoreWrong || extras.length === 0)) {
        blocked = true;
        onSuccess();
      } else {
        blocked = true;   // retry only after full release
        if (spread > win && opts.onNotSim) { this.sayInterject(opts.onNotSim.say); this.ui.mood("nervous", 1200); }
      }
    };
    return {
      init: () => {
        if (!anyHeld()) return;
        if (opts.allowPreHeld) tryComplete();   // song look-ahead: early correct hold passes
        else blocked = true;                    // stale hold from last segment: release first
      },
      down: (note) => {
        if (!target.has(note)) { if (!opts.ignoreWrong) this.wrongKey(note, opts.wrongOpts); return; }
        tryComplete();
      },
      up: () => { if (!anyHeld()) blocked = false; },
    };
  }
  waitChord(seg) {
    return this.waitSegment(
      (done) => this.makeChordWaiter(seg.notes, { win: seg.windowMs, onNotSim: seg.onNotSimultaneous },
        () => { Synth.correct(); this.ui.mood("cheer", 1000); done(); }),
      () => {}
    );
  }
  async waitChordCount(seg, tk) {
    const t = this.ui.showTicks(seg.count);
    for (let n = 1; n <= seg.count; n++) {
      await this.waitSegment(
        (done) => this.makeChordWaiter(seg.notes, { win: seg.windowMs }, () => done()),
        () => { this._skipAll = true; }
      );
      if (this.run !== tk) return;
      if (this._skipAll) { t.fill(seg.count); break; }
      Synth.correct(); t.fill(n);
    }
    t.success(); this.ui.mood("cheer", 1200); this.ui.clearStageSoon(900);
  }
  async followLight(seg, tk) {
    const fl = this.ui.showFollow(seg.sequence.length);
    const rgb = LED_RGB[seg.color] || LED_RGB.cyan;
    for (let i = 0; i < seg.sequence.length; i++) {
      if (this.run !== tk) return;
      const chord = seg.sequence[i].chord;
      this.hal.ledSet(chord.map((n) => ({ note: n, r: rgb[0], g: rgb[1], b: rgb[2] })));
      fl.current(i, chordDisplayName(chord));
      await this.waitSegment(
        (done) => this.makeChordWaiter(chord, { win: seg.windowMs }, () => done()),
        () => { this._skipAll = true; }
      );
      if (this.run !== tk) return;
      Synth.correct();
      if (seg.turnOffOnPress !== false) this.hal.ledOffMany(chord);
      fl.done(i);
      if (this._skipAll) { fl.all(); this.hal.ledClear(); break; }
      await this.sleep(260);
      if (this.run !== tk) return;
    }
    this.ui.mood("cheer", 1200);
    this.ui.clearStageSoon(700);
  }

  /* ---- play-along songs ---- */
  lightChord(seg, notes, brightness) {
    const rc = LED_RGB[seg.ledColor] || LED_RGB.cyan;
    const lc = LED_RGB[seg.leftHandColor] || LED_RGB.orange;
    this.hal.ledSet(notes.map((n, i) => {
      const c = (seg.leftHandColor && i === 0) ? lc : rc;   // chordMap puts the left-hand note first
      return { note: n, r: (c[0] * brightness) | 0, g: (c[1] * brightness) | 0, b: (c[2] * brightness) | 0 };
    }));
  }
  /* professor demo: backing beat + auto-played chords, LEDs and keys animate — then hand over */
  async songDemo(seg, tk) {
    const chart = seg.chart;
    const showLyrics = seg.displayMode === "lyrics" && this.ui.prefLyrics();
    const ctrl = this.ui.showSong(seg, "Demo · " + (SONG_TITLES[seg.song] || "Song"), showLyrics);
    const barMs = (60000 / SONG_BPM) * SONG_BEATS;
    this.ui.mood("conduct", 0);
    const timers = [];
    const skipHook = () => { this._skipAll = true; };
    for (let i = 0; i < chart.length; i++) {
      if (this.run !== tk || this._skipAll) break;
      while (this.paused && this.run === tk) await this._gate();       // stop button freezes the demo
      if (this.run !== tk || this._skipAll) break;
      const notes = seg.chordMap[chart[i].chord];
      this.lightChord(seg, notes, 1);
      ctrl.gate(i); ctrl.hit(i);
      notes.forEach((n) => { Synth.note(noteToMidi(n), 0, 1.7, 0.5); this.ui.KB.setDown(n, true); });
      timers.push(setTimeout(() => notes.forEach((n) => this.ui.KB.setDown(n, false)), barMs * 0.65));
      VocalPlayer.syncTo(seg.song, i * barMs);                         // real singer's voice, if the MP3 is present
      Backing.bar(chart[i].chord, barMs, true);                        // beat always on for the demo
      for (let b = 0; b < SONG_BEATS; b++) timers.push(setTimeout(() => ctrl.beat(b), (b * barMs) / SONG_BEATS));
      await this.sleep(barMs, skipHook);
      if (this.run !== tk) break;
      const keep = chart[i + 1] ? seg.chordMap[chart[i + 1].chord] : [];
      this.hal.ledOffMany(notes.filter((n) => !keep.includes(n)));
    }
    timers.forEach(clearTimeout);
    Backing.stop(); VocalPlayer.stop();
    this.hal.ledClear();
    this.ui.KB.clearDowns();
    ctrl.end();
    this.ui.mood("teach", 0);
    this.ui.clearStageSoon(600);
  }

  async playAlong(seg, tk) {
    const chart = seg.chart;
    const showLyrics = seg.displayMode === "lyrics" && this.ui.prefLyrics();
    const ctrl = this.ui.showSong(seg, SONG_TITLES[seg.song] || "Song", showLyrics);
    const barMs = (60000 / SONG_BPM) * SONG_BEATS;
    const look = seg.ledLookAheadMs || 500;
    this.ui.mood("conduct", 0);
    const beatTimers = [];
    const skipHook = () => { this._skipAll = true; };
    for (let i = 0; i < chart.length; i++) {
      if (this.run !== tk) break;
      const notes = seg.chordMap[chart[i].chord];
      this.lightChord(seg, notes, 1);
      this.hal.ledEffect("pulse", notes);          // pulse until the right chord lands
      ctrl.gate(i);
      VocalPlayer.pause();                         // singer waits at the gate with you
      await this.waitSegment(
        (done) => this.makeChordWaiter(notes, { win: seg.windowMs, ignoreWrong: true, allowPreHeld: true }, () => done()),
        skipHook
      );
      if (this.run !== tk || this._skipAll) break;
      this.lightChord(seg, notes, 1);              // solid again (stops pulse)
      ctrl.hit(i);
      VocalPlayer.syncTo(seg.song, i * barMs);     // real singer's voice, if the MP3 is present
      Backing.bar(chart[i].chord, barMs);
      for (let b = 0; b < SONG_BEATS; b++) beatTimers.push(setTimeout(() => ctrl.beat(b), (b * barMs) / SONG_BEATS));
      await this.sleep(barMs - look, skipHook);
      if (this.run !== tk || this._skipAll) break;
      const next = chart[i + 1];
      if (next) { this.lightChord(seg, seg.chordMap[next.chord], 0.35); ctrl.preview(i + 1); }   // 500ms look-ahead, dim
      await this.sleep(look, skipHook);
      if (this.run !== tk || this._skipAll) break;
      const keep = next ? seg.chordMap[next.chord] : [];
      this.hal.ledOffMany(notes.filter((n) => !keep.includes(n)));
    }
    beatTimers.forEach(clearTimeout);
    Backing.stop(); VocalPlayer.stop();
    this.hal.ledClear();
    ctrl.end();
    this.ui.mood("teach", 0);
    this.ui.clearStageSoon(900);
  }

  /* ---- quiz / flow / rewards ---- */
  async quiz(seg) {
    this.lastLine = seg.question;
    this.ui.typeText(seg.question);
    Speech.speak(seg.question, {});
    this.ui.mascotTalking(true);
    setTimeout(() => this.ui.mascotTalking(false), Speech.estimate(seg.question));
    let api = null;
    await this.waitSegment((done) => {
      api = this.ui.showQuiz(seg.options, (idx) => {
        if (idx === seg.answer) { api.correct(idx); Synth.chime(); this.ui.mood("cheer", 1400); setTimeout(done, 750); }
        else { api.wrong(idx, (seg.onWrong && seg.onWrong.label) || "Incorrect"); Synth.wrong(); this.ui.mood("nervous", 1100); }
      });
      return {};
    }, () => { if (api) api.correct(seg.answer); });
    if (seg.onCorrect && seg.onCorrect.typeSay) await this.typeSay(seg.onCorrect.typeSay);
    this.ui.clearStageSoon(300);
  }
  async nextButton() {
    await this.waitSegment((done) => { this.ui.showNext(() => done()); return {}; }, () => {});
    this.ui.clearStage();
  }
  async awardXP(amount) {
    this.xp += amount;
    this.ui.awardXP(amount, this.xp);
    Synth.success();
    await this.sleep(1700);
  }
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   BLOCK 4 — UI SHELL  (presentation only — screen layout, keyboard
   visualisation, stage widgets, settings, boot). No lesson logic here.
   ═══════════════════════════════════════════════════════════════════ */
const UI = (() => {
  const app = document.getElementById("app");
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const svgCheck = (sz, sw) => `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="${sw || 3.2}" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"></polyline></svg>`;

  app.innerHTML = `
  <div class="lesson">

      </a>
      <div class="progress" id="progress"></div>
      <button class="icon-btn" id="btn-skip" title="Skip ahead (dev)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M5 5l8 7-8 7z"></path><rect x="15" y="5" width="3.2" height="14" rx="1.2"></rect></svg>
      </button>
      <div class="hud">
        <span class="chip hearts"><span class="em">❤️</span><span id="hearts-v">5</span></span>
        <span class="chip xp"><span class="em">⚡</span><span id="xp-v">0</span></span>
        <button class="pill" id="hw-pill"><span class="dot"></span><span id="hw-pill-text">Simulator</span></button>
        <button class="icon-btn" id="btn-gear" title="Settings">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3v2.5M12 18.5V21M21 12h-2.5M5.5 12H3M18 6l-1.8 1.8M7.8 16.2 6 18M18 18l-1.8-1.8M7.8 7.8 6 6"></path></svg>
        </button>
      </div>
    </div>
    <div class="midzone">
      <div class="talkrow">
        <div class="mascot-wrap" id="mascot-wrap">
          <div class="mascot" id="mascot"><img id="mascot-img" src="assets/maestro/teach.png" alt="Professor penguin" onload="this.style.display='';this.parentElement.classList.remove('noimg')" onerror="this.style.display='none';this.parentElement.classList.add('noimg')"></div>
          <div class="talk-dots"><i></i><i></i><i></i></div>
        </div>
        <div class="bubble"><p class="bubble-text" id="bubble-text"></p>
          <div class="line-ctls">
            <button class="lbtn" id="btn-line-prev" title="Previous line"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4" fill="currentColor" stroke="none"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg></button>

  const $ = (id) => document.getElementById(id);

  /* ------------------------------ keyboard ------------------------------ */
  const KB = (() => {
    const low = 36, high = 96;
    const midis = []; for (let m = low; m <= high; m++) midis.push(m);
    const whites = midis.filter((m) => !isBlackKey(m));
    const wW = 100 / whites.length;
    const whiteIndex = (m) => whites.indexOf(m);
    const zone = $("kbzone");
    const strip = document.createElement("div"); strip.className = "kb-led";
    const body = document.createElement("div"); body.className = "kb-body";
    body.innerHTML = `<div class="kb-felt"></div>`;
    const keys = document.createElement("div"); keys.className = "kb-keys";
    const wrow = document.createElement("div"); wrow.className = "kb-white-row";
    keys.appendChild(wrow); body.appendChild(keys);
    zone.appendChild(strip); zone.appendChild(body);
    const keyEls = new Map(), dotEls = new Map();
    const centerPct = (m) => isBlackKey(m) ? (whiteIndex(m - 1) + 1) * wW : (whiteIndex(m) + 0.5) * wW;
    midis.forEach((m) => {
      const d = document.createElement("div");
      d.className = "ldot"; d.style.left = centerPct(m) + "%";
      if (m === 96) d.style.display = "none";       // C7 has no LED
      strip.appendChild(d); dotEls.set(m, d);
    });
    whites.forEach((m) => {
      const k = document.createElement("div");
      k.className = "pk-w"; k.dataset.midi = m;
      const oct = Math.floor(m / 12) - 1;
      k.innerHTML = `<span class="nname"></span><span class="klabel">${m % 12 === 0 ? "C" + oct : ""}</span>`;
      wrow.appendChild(k); keyEls.set(m, k);
    });
    const bw = wW * 0.62;
    midis.filter(isBlackKey).forEach((m) => {
      const k = document.createElement("div");
      k.className = "pk-b"; k.dataset.midi = m;
      k.style.left = `calc(${centerPct(m)}% - ${bw / 2}%)`; k.style.width = bw + "%";
      k.innerHTML = `<span class="nname"></span>`;
      keys.appendChild(k); keyEls.set(m, k);
    });
    keys.addEventListener("pointerdown", (e) => {
      const el = e.target.closest("[data-midi]"); if (!el) return;
      if (HW.mode !== "sim") return;
      HW.backend.press(parseInt(el.dataset.midi, 10));
    });
    let prevLit = new Map();
    function renderLed(snap) {
      const union = new Set([...prevLit.keys(), ...snap.keys()]);
      union.forEach((m) => {
        const c = snap.get(m) || null, was = prevLit.get(m) || null;
        if (c === was) return;
        const dot = dotEls.get(m), key = keyEls.get(m);
        if (!key) return;

          key.classList.add("lit");
          key.style.background = isBlackKey(m) ? `linear-gradient(180deg, ${c}, #141414)` : `linear-gradient(180deg, #ffffff, ${c})`;
          key.style.boxShadow = `0 0 16px 2px ${c}aa, inset 0 -5px 8px ${c}55`;
          const nn = key.querySelector(".nname"); if (nn) nn.textContent = NOTE_NAMES[m % 12];
        } else {

          key.classList.remove("lit");
          key.style.background = ""; key.style.boxShadow = "";

      });
      prevLit = snap;
    }

      const key = keyEls.get(noteToMidi(note)); if (!key) return;
      key.classList.toggle("down", on);
    }
    function clearDowns() { keyEls.forEach((k) => k.classList.remove("down")); }

    return { renderLed, setDown, clearDowns, setInteractive };

    const n = seg.chart.length;
    setStage(`<div class="song">

  /* ------------------------------ rewards ------------------------------- */
  function fireConfetti(host, count) {
    const cv = document.createElement("canvas");

    host.appendChild(cv);

    const W = cv.width = cv.offsetWidth || 1280, H = cv.height = cv.offsetHeight || 800;
    const cols = ["#58CC02", "#F5B800", "#5BB8E3", "#FF7A52", "#FF4B4B", "#9b59ff"];
    const parts = Array.from({ length: count }, () => ({
      x: W / 2 + (Math.random() - 0.5) * 140, y: H / 2 - 40,
      vx: (Math.random() - 0.5) * 16, vy: Math.random() * -16 - 6,

      t++; ctx.clearRect(0, 0, W, H);
