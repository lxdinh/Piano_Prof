        renderSettings(); renderStart();
      }));
  }
  function renderSettings() {
    if (!popOpen) return;
    const s = HW.backend.status;
    const stateColor = s.state === "connected" || s.state === "sim" ? "#58CC02" : s.state === "connecting" ? "#F5B800" : "#FF7A52";
    pop.innerHTML = `
      <h3>Piano hardware</h3>
      <div class="set-row">${modeToggleHtml("mode-toggle")}</div>
      ${HW.mode === "ble" ? `
      <div class="set-row">
        <div><div class="lab" style="display:flex;align-items:center;gap:8px;"><span style="width:10px;height:10px;border-radius:50%;background:${stateColor};display:inline-block;"></span>${s.state === "connected" ? esc(s.detail || "Connected") : s.state === "connecting" ? "Connecting…" : s.state === "disconnected" ? "Disconnected" : "Not connected"}</div>
        <div class="sub">${s.state === "error" ? esc(s.detail) : "ESP32-S3 · USB-MIDI in · 60-LED strip"}</div></div>
        <button class="btn-chunky" id="btn-connect" style="padding:10px 18px;font-size:14px;">${s.state === "connected" ? "Reconnect" : "Connect"}</button>
      </div>` : `
      <div class="kbd-help" style="margin:6px 0 2px;">
        <b>Simulator input</b> — click keys (clicks within 1s = one chord), or use your computer keyboard:<br>
        <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd><kbd>G</kbd><kbd>H</kbd><kbd>J</kbd> = C4–B4 · blacks <kbd>W</kbd><kbd>E</kbd><kbd>T</kbd><kbd>Y</kbd><kbd>U</kbd> · <kbd>K</kbd> = C5 · <kbd>Z</kbd>/<kbd>X</kbd> octave −/+
      </div>`}
      <h3 style="margin-top:14px;">Lesson</h3>
      <div class="set-row"><div><div class="lab">Professor voice</div><div class="sub">Speech synthesis, English</div></div>
        <button class="switch ${UI.prefs.voice ? "on" : ""}" id="sw-voice" aria-label="Voice"></button></div>
      <div class="set-row"><div><div class="lab">Sound effects</div><div class="sub">Backing track & feedback jingles</div></div>
        <button class="switch ${UI.prefs.sfx ? "on" : ""}" id="sw-sfx" aria-label="Sound effects"></button></div>
      <div class="set-row"><div><div class="lab">Show lyrics</div><div class="sub">Dev flag — release builds show chords only</div></div>
        <button class="switch ${UI.prefs.lyrics ? "on" : ""}" id="sw-lyrics" aria-label="Lyrics"></button></div>
      <div class="set-row" style="justify-content:flex-end;gap:10px;">
        <button class="btn-chunky ghost" id="btn-restart" style="padding:9px 16px;font-size:14px;">Restart lesson</button>
      </div>`;
    bindModeToggle("mode-toggle");
    const bc = $("btn-connect");
    if (bc) bc.addEventListener("click", () => HW.connect().catch(() => {}));
    $("sw-voice").addEventListener("click", () => { UI.prefs.voice = !UI.prefs.voice; Speech.setMuted(!UI.prefs.voice); renderSettings(); });
    $("sw-sfx").addEventListener("click", () => { UI.prefs.sfx = !UI.prefs.sfx; Synth.setCues(UI.prefs.sfx); renderSettings(); });
    $("sw-lyrics").addEventListener("click", () => { UI.prefs.lyrics = !UI.prefs.lyrics; renderSettings(); });
    $("btn-restart").addEventListener("click", () => { closeSettings(); engine.xp = 0; UI.setXP(0); UI.resetBubble(); engine.start(0); });
  }
  function openSettings() { popOpen = true; pop.classList.remove("hidden"); renderSettings(); }
  function closeSettings() { popOpen = false; pop.classList.add("hidden"); }
  $("btn-gear").addEventListener("click", (e) => { e.stopPropagation(); popOpen ? closeSettings() : openSettings(); });
  pill.addEventListener("click", (e) => { e.stopPropagation(); openSettings(); });
  document.addEventListener("click", (e) => { if (popOpen && !pop.contains(e.target)) closeSettings(); });

  /* ------------------------- computer keyboard ------------------------- */
  const KEYMAP = { a: 0, w: 1, s: 2, e: 3, d: 4, f: 5, t: 6, g: 7, y: 8, h: 9, u: 10, j: 11, k: 12, o: 13, l: 14, p: 15, ";": 16, "'": 17 };
  let kbAnchor = 60;
  const codeHeld = new Map();
  window.addEventListener("keydown", (e) => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === "z" || k === "x") {
      kbAnchor = k === "z" ? Math.max(36, kbAnchor - 12) : Math.min(84, kbAnchor + 12);
      UI.toast("Keyboard octave: " + midiToNote(kbAnchor) + "–" + midiToNote(Math.min(96, kbAnchor + 12)));
      return;
    }
    if (!(k in KEYMAP) || HW.mode !== "sim" || codeHeld.has(k)) return;
    const midi = kbAnchor + KEYMAP[k];
    codeHeld.set(k, midi);
    HW.backend.keyDown(midi);
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key.toLowerCase();
    const midi = codeHeld.get(k);
    if (midi == null) return;
    codeHeld.delete(k);
    if (HW.mode === "sim") HW.backend.keyUp(midi);
  });

  /* ------------------------------ top bar ------------------------------ */
  $("btn-skip").addEventListener("click", () => engine.skip());
  $("btn-line-prev").addEventListener("click", () => engine.prevLine());
  $("btn-line-replay").addEventListener("click", () => engine.replayLine());
  $("btn-line-stop").addEventListener("click", () => engine.pauseToggle());
  UI.buildProgress(LESSONS[1].steps, (i, title) => {
    UI.resetBubble();
    engine.gotoStep(i);
    UI.toast("Section " + (i + 1) + " — " + title);
  });
  UI.progress(0, 0, 1);

  /* tap sound on tappables (piano keys excluded via data-noclk) */
  document.addEventListener("pointerdown", (e) => {
    if (e.target.closest("[data-noclk]")) return;
    if (e.target.closest("button, .pseg, a.btn-chunky")) Synth.tap();
  }, true);

  /* ---------------------------- start overlay --------------------------- */
  const startEl = $("start-overlay");
  function renderStart() {
    if (startEl.classList.contains("hidden")) return;
    const s = HW.backend.status;
    startEl.innerHTML = `
      <div class="modal-card" style="width:600px;max-width:92%;">
        <div style="width:116px;height:116px;border-radius:50%;background:#EAF8DC;overflow:hidden;box-shadow:0 0 0 5px #fff,0 10px 24px #0002;margin:0 auto 12px;animation:pp-float 3.2s ease-in-out infinite;">
          <img src="assets/maestro/welcome-piano.png" alt="Professor penguin" style="width:100%;height:100%;object-fit:contain;object-position:center 58%;" onerror="this.style.display='none';this.parentElement.classList.add('noimg')"></div>
        <p style="margin:0;font-size:14px;font-weight:900;color:#F5B800;text-transform:uppercase;letter-spacing:2px;">Lesson 1</p>
        <h1 style="margin:4px 0 6px;font-size:32px;font-weight:900;color:var(--ink);">First Touch → First Songs</h1>
        <p style="margin:0 0 18px;font-size:15.5px;font-weight:700;color:var(--ink-soft);">Middle C · the 7 notes · 4 chords · 3 real songs</p>
        <div style="margin-bottom:14px;">${modeToggleHtml("start-mode")}</div>
        ${HW.mode === "ble" ? `
          <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;">
            <span style="width:10px;height:10px;border-radius:50%;flex-shrink:0;background:${s.state === "connected" ? "#58CC02" : s.state === "connecting" ? "#F5B800" : "#B4AA8C"};"></span>
            <span style="font-size:14px;font-weight:800;color:var(--ink-soft);">${s.state === "connected" ? esc(s.detail || "Connected") : s.state === "connecting" ? "Connecting…" : s.state === "error" ? esc(s.detail) : "Board not connected"}</span>
            <button class="btn-chunky" id="start-connect" style="padding:9px 16px;font-size:13.5px;">${s.state === "connected" ? "Reconnect" : "Connect board"}</button>
          </div>` : `
          <p style="margin:0 0 16px;font-size:13px;font-weight:700;color:var(--ink-faint);">No board needed — click the on-screen keys, or play <b>A S D F G H J</b> on your computer keyboard.</p>`}
        <button class="btn-chunky glow" id="btn-start" style="font-size:21px;padding:17px 44px;">${savedStep > 0 ? "Resume · Section " + (savedStep + 1) : "Start lesson"}</button>
        <p style="margin:14px 0 0;font-size:12.5px;font-weight:700;color:var(--ink-faint);">🔊 Sound on — the professor talks you through it.</p>
      </div>`;
    bindModeToggle("start-mode");
    const sc = $("start-connect");
    if (sc) sc.addEventListener("click", () => HW.connect().catch(() => {}).then(renderStart));
    $("btn-start").addEventListener("click", () => {
      Synth.ensure();
      startEl.classList.add("hidden"); startEl.innerHTML = "";
      engine.start(savedStep);
    });
  }
  renderStart();

  /* dev/test hooks — drive the lesson without hardware:
     PP_DEV.press('C4') · PP_DEV.chord(['C4','E4','G4']) · PP_DEV.skip() · PP_DEV.goto(2) */
  window.PP_DEV = {
    engine,
    press(n) { if (HW.mode === "sim") HW.backend.press(typeof n === "string" ? noteToMidi(n) : n); },
    chord(ns) { ns.forEach((n) => this.press(n)); },
    skip() { engine.skip(); },
    goto(i) { UI.resetBubble(); engine.gotoStep(i); },
  };
})();
</script>

  <script>
    (function () {
      var canvas = document.getElementById("pp-canvas");
      function fit() {
        var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
        canvas.style.transform = "translate(-50%,-50%) scale(" + s + ")";
      }
      window.addEventListener("resize", fit);
      fit();
    })();
  </script>
</body>
</html>
