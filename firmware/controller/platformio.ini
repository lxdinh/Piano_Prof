; Piano Prof — controller_v2 firmware (ESP32-S3-MINI-1-N4R2)
;
; SHIPPING PATH: this image is delivered over BLE by the phone app, into
; ota_0/ota_1. Just build it and hand `.pio/build/controller_v2/firmware.bin`
; to the app's firmware-update screen:
;
;   pio run                  # build only
;
; BENCH PATH: `pio run -t upload` still works over USB-C, but note that it
; writes to the *factory* slot (0x10000) — the first app partition in the
; table — and therefore overwrites the recovery image that lives there. That
; is fine while iterating; restore it afterwards with:
;
;   cd ../factory && pio run -t upload
;
;   pio device monitor       # serial log @ 115200
;
[env:controller_v2]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; ESP32-S3-MINI-1-N4R2 = 4 MB flash. Route Serial + upload over the native USB.
; The devkitc-1 board profile defaults to the 8 MB variant, so we must pin BOTH
; the build (bootloader header + partition table) AND the upload to 4 MB, or the
; 2nd-stage bootloader faults on a size mismatch and boot-loops before setup().
board_build.flash_size  = 4MB
board_upload.flash_size = 4MB
; Shared with firmware/factory — the bootloader reads ONE table out of flash,
; so both projects must agree or whichever was flashed last relocates the
; other's slots. Adds a permanent `factory` recovery image alongside the two
; OTA slots; each app slot is still 0x140000, same as Arduino's default.csv.
board_build.partitions  = ../partitions_pianoprof.csv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  fastled/FastLED@^3.9.0
  h2zero/NimBLE-Arduino@^2.2.0
