<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuminaKeys — Learn Piano the Smart Way</title>
  <meta name="description" content="AI-powered interactive piano learning. Chords first. Real songs fast.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="logo">🎹 LuminaKeys</div>
    <div class="topbar-stats">
      <div class="stat-chip streak"><span class="icon">🔥</span><span id="streak-val">0</span></div>
      <div class="stat-chip xp"><span class="icon">⭐</span><span id="xp-val">0</span> XP</div>
      <div class="stat-chip hearts" id="hearts-val">❤️❤️❤️❤️❤️</div>
    </div>
    <div id="grade-badge">Select Grade</div>
  </header>

  <div class="app-body">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h3>Your Journey</h3>
        <div class="xp-bar-wrap"><div class="xp-bar" id="xp-bar" style="width:0%"></div></div>
      </div>
      <div class="grade-list" id="grade-list"></div>
    </aside>

    <!-- MAIN -->
    <div class="main-panel">
      <div class="lesson-area" id="lesson-area"></div>
      <div id="status-bar">Welcome! Choose a grade to begin.</div>
      <div class="piano-section">
        <div class="piano-wrapper">
          <div class="led-row" id="led-row"></div>
          <div class="piano" id="piano"></div>
        </div>
      </div>
    </div>

  </div>

  <script src="lessons.js"></script>
  <script src="app.js"></script>
</body>
</html>
